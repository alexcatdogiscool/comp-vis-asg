name: segformer
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pytorch=2.5.*
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  - numpy=1.26.*
  - scipy
  - pillow
  - sympy=1.13.1
  - pip
  - pip:
      - transformers==4.41.2
      - huggingface-hub==0.23.0
      - safetensors
